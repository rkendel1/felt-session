<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Session</title>
    <link rel="stylesheet" href="shell.css" />
    <style>
      /* The only thing this page adds to the shared chrome: its field and
         actions stack the way the rest of `main` does. */
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #local-form {
        width: min(520px, calc(100vw - 48px));
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 120px;
        gap: 0 10px;
        width: 100%;
      }
      .grid .field { width: 100%; text-align: left; }
      .wide { grid-column: 1 / -1; }
      details { width: 100%; margin-top: 18px; color: var(--text-dim); }
      summary { cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="mark.png" width="76" height="76" alt="" />
      <h1 id="title">Connect to your server</h1>
      <p class="message">Enter the address of the Open Session server you use.</p>
      <form id="local-form" autocomplete="off" hidden>
        <div class="grid">
          <input class="field" id="product-name" aria-label="Product name" placeholder="Product name" />
          <input class="field" id="port" type="number" aria-label="Port" placeholder="Port" />
          <input class="field wide" id="server-url" aria-label="Server URL" placeholder="Server URL" />
          <details class="wide">
            <summary>Advanced settings</summary>
            <input class="field" id="bind-address" aria-label="Bind address" placeholder="Bind address" />
            <input class="field" id="repo-path" aria-label="Repository path" placeholder="Repository path" />
            <input class="field" id="repo-id" aria-label="Repository id" placeholder="Repository id" />
            <input class="field" id="repo-branch" aria-label="Default branch" placeholder="Default branch" />
            <input class="field" id="worktrees-dir" aria-label="Worktrees directory" placeholder="Worktrees directory" />
          </details>
        </div>
        <div class="actions">
          <button class="button" id="host" type="submit">Set up this Mac</button>
          <button class="button ghost" id="show-connect" type="button">Connect to another server</button>
        </div>
      </form>
      <form id="form" autocomplete="off">
        <input
          class="field"
          id="field"
          type="text"
          inputmode="url"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          placeholder="os.example.com"
          aria-label="Server address"
        />
        <div class="actions">
          <button class="button" id="submit" type="submit">Continue</button>
          <button class="button ghost" id="anyway" type="button" hidden>Use anyway</button>
          <button class="button ghost" id="cancel" type="button" hidden>Cancel</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      // The address belongs to main.js, which reaches this page through
      // preload.js and refuses the same calls from anywhere else.
      const server = window.os1 && window.os1.server;
      const params = new URLSearchParams(location.search);
      // Someone who already has a server and came back through the app menu or
      // the status page. The first run has nothing to go back to.
      const mode = params.get("mode");
      const changing = mode === "change" || mode === "add";

      const field = document.getElementById("field");
      const submit = document.getElementById("submit");
      const anyway = document.getElementById("anyway");
      const cancel = document.getElementById("cancel");
      const status = document.getElementById("status");
      const connectForm = document.getElementById("form");
      const localForm = document.getElementById("local-form");

      field.value = params.get("url") || "";
      if (changing) {
        document.getElementById("title").textContent = mode === "add" ? "Add organization" : "Change server";
        submit.textContent = mode === "add" ? "Connect" : "Save";
        cancel.hidden = false;
      } else {
        status.textContent = "You can change this later in the app menu.";
      }
      field.focus();
      field.select();

      function host(value) {
        try {
          return new URL(/^https?:\/\//i.test(value) ? value : "https://" + value).host;
        } catch {
          return value;
        }
      }

      let busy = false;

      // `check` asks whether anything answers there first. A typo and a server
      // that is simply down look identical from this screen, and only one of
      // them is worth saving, so the answer decides which. It stays an offer
      // rather than a gate, because an instance behind a VPN that is not up yet
      // is a normal thing to be setting up for.
      async function save(check) {
        if (busy || !server) return;
        const value = field.value.trim();
        if (!value) {
          field.focus();
          return;
        }
        busy = true;
        submit.disabled = true;
        anyway.hidden = true;
        status.textContent = check ? "Checking " + host(value) + "…" : "Connecting…";
        try {
          let address = value;
          if (check) {
            const reached = await server.probe(value);
            if (!reached.ok) {
              status.textContent = reached.error || "Couldn't reach " + host(value) + ".";
              anyway.hidden = false;
              return;
            }
            // What answered, which is not always what was typed: a bare host
            // resolves to a scheme. Show it, so the address being saved is the
            // one on screen.
            if (reached.url) field.value = address = reached.url;
          }
          status.textContent = "Connecting…";
          const saved = await server.save(address);
          // On success the shell navigates away or restarts, so there is
          // nothing left for this page to say.
          if (!saved.ok) status.textContent = saved.error || "Couldn't save that address.";
        } finally {
          busy = false;
          submit.disabled = false;
        }
      }

      connectForm.addEventListener("submit", (e) => {
        e.preventDefault();
        save(true);
      });
      anyway.addEventListener("click", () => save(false));
      cancel.addEventListener("click", () => server && server.cancel());
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && changing && !busy) server && server.cancel();
      });

      function showConnect() {
        localForm.hidden = true;
        connectForm.hidden = false;
        document.getElementById("title").textContent = "Connect to your server";
        document.querySelector(".message").textContent = "Enter the address of the Open Session server you use.";
        status.textContent = "";
        field.focus();
      }

      async function initializeLocalSetup() {
        const local = server && server.localSetup;
        if (!local) return;
        const info = await local.info();
        if (!info.available) return;
        const defaults = info.defaults;
        for (const [id, key] of [
          ["product-name", "productName"], ["port", "port"],
          ["server-url", "publicBaseUrl"], ["bind-address", "host"],
          ["repo-path", "repoPath"], ["repo-id", "repoId"],
          ["repo-branch", "repoBranch"], ["worktrees-dir", "worktreesDir"],
        ]) document.getElementById(id).value = defaults[key];
        connectForm.hidden = true;
        localForm.hidden = false;
        document.getElementById("title").textContent = "Self-host Open Session";
        document.querySelector(".message").textContent = "Configure a private server on this Mac. The app will start it for you.";
        status.textContent = "Your data stays on this Mac unless you configure remote services.";
        document.getElementById("product-name").focus();
      }

      document.getElementById("show-connect").addEventListener("click", showConnect);
      localForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (busy || !server?.localSetup) return;
        busy = true;
        const hostButton = document.getElementById("host");
        hostButton.disabled = true;
        status.textContent = "Configuring and starting your server…";
        const value = (id) => document.getElementById(id).value.trim();
        const request = {
          installService: true,
          answers: {
            productName: value("product-name"),
            host: value("bind-address"),
            port: Number(value("port")),
            publicBaseUrl: value("server-url"),
            repoPath: value("repo-path"),
            repoId: value("repo-id"),
            repoBranch: value("repo-branch"),
            worktreesDir: value("worktrees-dir"),
          },
        };
        try {
          const result = await server.localSetup.run(request);
          if (!result.ok) {
            status.textContent = result.error || "Setup failed.";
            return;
          }
          status.textContent = "Opening Open Session…";
          await server.save(result.url);
        } finally {
          busy = false;
          hostButton.disabled = false;
        }
      });
      initializeLocalSetup();
    </script>
  </body>
</html>
