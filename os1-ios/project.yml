name: OS1
options:
  bundleIdPrefix: dev.tella
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    # v0.6.0 depends on HighlightSwift by revision, so SwiftPM rejects it
    # under a stable semver rule. Pin the release tag's commit instead.
    revision: c7b12f7b3d77caa188fd1fc056d0f7ce305ef5cd
targets:
  OS1:
    type: application
    platform: iOS
    sources:
      - OS1
    dependencies:
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_OS1DefaultServerURL: http://127.0.0.1:3850
        # "Take a photo" in the composer's + menu. The photo library needs no
        # string: PhotosPicker runs out of process.
        INFOPLIST_KEY_NSCameraUsageDescription: Attach a photo you take to a message.
        # Desk voice mode: live mic capture for the Realtime voice call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to your Desk — live voice conversations with your workspace.
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1
        DEVELOPMENT_TEAM: 6GUXT43C8B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
      configs:
        # Release = App Store signing, scoped to the app target only. These
        # used to ride the CI xcodebuild command line, but command-line
        # settings apply to EVERY target — and SwiftPM package targets
        # (SwiftStreamingMarkdown and friends) reject provisioning profiles,
        # failing the archive. Debug stays Automatic for local dev.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OS1 App Store
  OS1Mac:
    type: application
    platform: macOS
    sources:
      - OS1
    dependencies:
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    entitlements:
      path: OS1Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Image attachments picked via the open panel (fileImporter).
        com.apple.security.files.user-selected.read-only: true
        # Desk voice mode: live mic capture for the Realtime voice call.
        com.apple.security.device.audio-input: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_OS1DefaultServerURL: http://127.0.0.1:3850
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Desk voice mode: live mic capture for the Realtime voice call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to your Desk — live voice conversations with your workspace.
        PRODUCT_NAME: OS1
        # Same id as the iOS target: one App Store Connect record (universal
        # purchase) hosts both platforms. The Electron shell (os1-mac) moved
        # to dev.tella.os1.shell so no two Mac apps share a bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1
        DEVELOPMENT_TEAM: 6GUXT43C8B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
      configs:
        # See the OS1 target: manual App Store signing must be target-scoped,
        # not passed globally on the CI command line, because SwiftPM package
        # targets reject provisioning profiles.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OS1 Mac App Store
    # The test sources are pure logic. Hosting them in the native macOS app
    # avoids booting and installing into an iOS simulator on every CI run.
    scheme:
      testTargets:
        - OS1Tests
  OS1Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OS1Tests
    dependencies:
      - target: OS1Mac
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1.tests
        SWIFT_VERSION: "5.9"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OS1.app/Contents/MacOS/OS1
